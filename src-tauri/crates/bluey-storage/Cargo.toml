[package]
name = "bluey-storage"
version = "0.1.0"
description = "SQLite persistence for Bluey: migrations, repositories, FTS search, document indexing and retrieval"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[dependencies]
bluey-core = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
chrono = { workspace = true }
uuid = { workspace = true }
tracing = { workspace = true }
regex = { workspace = true }
rusqlite = { workspace = true }
parking_lot = "0.12"
# Document parsing (pure Rust — no C toolchain required)
pdf-extract = "0.9"
zip = { version = "4", default-features = false, features = ["deflate"] }
quick-xml = "0.37"
unicode-segmentation = "1"

[features]
default = ["bundled-sqlite"]
bundled-sqlite = ["rusqlite/bundled"]

[dev-dependencies]
tempfile = "3"
pretty_assertions = "1"
