[package]
name = "bluey"
version = "0.1.0"
description = "Bluey — a real-time AI desktop context copilot for macOS"
authors = ["Bluey contributors"]
edition = "2021"
rust-version = "1.85"
license = "UNLICENSED"
publish = false

[lib]
# The `_lib` suffix keeps the lib name unique so it does not conflict with the bin name.
name = "bluey_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[workspace]
members = ["crates/bluey-core", "crates/bluey-storage", "crates/bluey-protocols"]

[workspace.package]
edition = "2021"
rust-version = "1.85"
license = "UNLICENSED"

[workspace.dependencies]
bluey-core = { path = "crates/bluey-core" }
bluey-storage = { path = "crates/bluey-storage" }
bluey-protocols = { path = "crates/bluey-protocols" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
anyhow = "1"
chrono = { version = "0.4", features = ["serde", "clock"], default-features = false }
uuid = { version = "1", features = ["v4", "serde"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json", "fmt"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "process", "io-util", "fs"] }
tokio-util = { version = "0.7", features = ["rt"] }
futures = "0.3"
async-trait = "0.1"
base64 = "0.22"
regex = "1"
rusqlite = { version = "0.40", features = [] }
sha2 = "0.10"
url = "2"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
bluey-core = { workspace = true }
bluey-storage = { workspace = true }
bluey-protocols = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
anyhow = { workspace = true }
chrono = { workspace = true }
uuid = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
tokio = { workspace = true, features = ["net"] }
tokio-util = { workspace = true }
futures = { workspace = true }
async-trait = { workspace = true }
base64 = { workspace = true }
regex = { workspace = true }
sha2 = { workspace = true }
url = { workspace = true }
rand = "0.9"

tauri = { version = "2", features = ["tray-icon", "image-png", "macos-private-api"] }
tauri-plugin-opener = "2"
tauri-plugin-deep-link = "2"
tauri-plugin-shell = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-notification = "2"
tauri-plugin-os = "2"
tauri-plugin-process = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-autostart = "2"

reqwest = { version = "0.13", default-features = false, features = ["json", "form", "stream", "native-tls", "http2"] }
tokio-tungstenite = { version = "0.30", features = ["native-tls"] }
eventsource-stream = "0.2"
keyring = { version = "3", features = ["apple-native"] }
dirs = "6"
parking_lot = "0.12"
bytes = "1"

[target.'cfg(target_os = "macos")'.dependencies]
# objc2-based rewrite (branch v2.1). Pin to a rev before release for reproducibility.
tauri-nspanel = { git = "https://github.com/ahkohd/tauri-nspanel", branch = "v2.1" }
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSString", "NSArray", "NSDictionary", "NSURL", "NSGeometry"] }
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSApplication", "NSWindow", "NSScreen", "NSRunningApplication", "NSWorkspace", "NSPanel", "NSResponder", "NSGraphics"] }
core-foundation = "0.10"
# CGPreflightScreenCaptureAccess / CGRequestScreenCaptureAccess
core-graphics = "0.25"
# AXIsProcessTrusted / AXIsProcessTrustedWithOptions
accessibility-sys = "0.2"

[features]
default = ["bundled-sqlite"]
# Compile SQLite from source (release builds). Disabled for the Linux-host darwin cross-check.
bundled-sqlite = ["bluey-storage/bundled-sqlite"]
# Enable the in-process mock AI provider and dev simulations (also available in debug builds).
dev-tools = []

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

[profile.dev]
opt-level = 0
debug = 1
